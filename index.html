<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Notre album privé</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div id="loginView" class="screen"><div class="login-card"><div class="brand">Notre album</div><p class="subtitle">Nos souvenirs, en toute intimité.</p><span class="badge">🔒 ESPACE PRIVÉ</span><form id="loginForm"><input id="email" type="email" placeholder="E-mail" autocomplete="username" required><input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required><button>Entrer dans l’album</button><p id="loginError" class="error"></p></form></div></div><div id="appView" class="hidden"><header class="hero"><div class="brand">Notre album</div><p>Photos & vidéos de nos souvenirs.</p><span class="badge">🔒 PRIVÉ</span></header><main><section class="toolbar"><div><h2>Souvenirs</h2><p>Ajoutez vos photos et vidéos depuis votre téléphone ou votre PC.</p></div><div class="actions"><label class="upload-btn">＋ Ajouter<input id="fileInput" type="file" accept="image/*,video/*" multiple></label><button id="logoutBtn" class="secondary">Déconnexion</button></div></section><div id="progress" class="progress hidden"></div><section id="gallery" class="gallery"></section></main></div><script src="config.js"></script><script src="app.js"></script></body></html>
